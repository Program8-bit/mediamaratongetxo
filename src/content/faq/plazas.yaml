pregunta: ¿Hay límite de plazas?
respuesta: Sí, las plazas son limitadas y las inscripciones se cierran el miércoles 31 de marzo de 2027 a las 22:00, o antes si se alcanza el aforo.
preguntaEu: Plaza-mugarik dago?
respuestaEu: Bai, plazak mugatuak dira eta izen-ematea 2027ko martxoaren 31n (asteazkena) 22:00etan itxiko da, edo lehenago edukiera betetzen bada.
