pregunta: ¿Dónde puedo aparcar el día de la carrera?
respuesta: Se habilitan zonas de aparcamiento gratuito cerca de Fadura. Recomendamos usar el transporte público siempre que sea posible.
preguntaEu: Non aparka dezaket lasterketa egunean?
respuestaEu: Fadura inguruan doako aparkaleku-eremuak jarriko dira. Ahal denean, garraio publikoa erabiltzea gomendatzen dugu.
