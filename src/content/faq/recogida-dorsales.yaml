pregunta: ¿Cuándo puedo recoger mi dorsal?
respuesta: |
  La recogida de dorsales se realizará en la Ciudad Deportiva de Fadura, durante los días y horario que se detalla a continuación. Importante: no se entregarán los dorsales fuera de esos horarios y en ciertos momentos se pueden originar colas... ¡sed precavidos!

  Viernes (misma semana de la prueba): 18:00–20:30
  Sábado (misma semana de la prueba): 09:00–14:00h
  Domingo: de 8:00 a 30 min antes de la salida correspondiente.

  La utilización del dorsal y el chip será obligatoria.
orden: 3
