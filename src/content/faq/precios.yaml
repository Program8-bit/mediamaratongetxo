pregunta: ¿Habrá cambio de precio?
respuesta: |
  Sí, habrá cambio de precio. Aquí tenéis las fechas.

  Hasta el 31 de agosto de 2026:
  · 5K: 10€ con dorsal con chip.
  · 10K: 15€ con dorsal con chip, y con derecho a regalo*.
  · Media Maratón: 30€ con dorsal con chip, y con derecho a regalo*.

  Del 1 de septiembre al 31 de diciembre de 2026:
  · 5K: 12€ con dorsal con chip.
  · 10K: 18€ con dorsal con chip, y con derecho a regalo*.
  · Media Maratón: 35€ con dorsal con chip, y con derecho a regalo*.

  Del 1 de enero de 2027 hasta el cierre de inscripciones:
  · 5K: 15€ con dorsal con chip.
  · 10K: 20€ con dorsal con chip, y con derecho a regalo*.
  · Media Maratón: 40€ con dorsal con chip, y con derecho a regalo*.
