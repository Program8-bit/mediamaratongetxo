pregunta: ¿Tiempo de corte? ¿Qué pasa si no llego?
respuesta: |
  Estos son los tiempos de corte a partir de los cuales se os podrá indicar que abandonéis la prueba. Sin embargo, y siempre que las circunstancias lo permitan, simplemente se os indicará que os quitéis el dorsal y podréis continuar el recorrido. Eso sí, bajo vuestra responsabilidad.

  Media maratón: 2h 15min
  10K: 1h
  5K: 30 min
preguntaEu: Muga-denbora? Zer gertatzen da iristen ez banaiz?
respuestaEu: |
  Hauek dira muga-denborak, hauetatik aurrera proba uzteko esan ahal izango zaizue. Hala ere, baldintzek uzten badute, dortsala kentzeko esango zaizue soilik eta ibilbidea jarraitu ahal izango duzue, zeuen erantzukizunpean.

  Media Maratoia: 2 ordu 15 min
  10K: 1 ordu
  5K: 30 min
