pregunta: ¿Tiempo de corte? ¿Qué pasa si no llego?
respuesta: |
  Estos son los tiempos de corte a partir de los cuales se os podrá indicar que abandonéis la prueba. Sin embargo, y siempre que las circunstancias lo permitan, simplemente se os indicará que os quitéis el dorsal y podréis continuar el recorrido. Eso sí, bajo vuestra responsabilidad.

  Media maratón: 2h 15min
  10K: 1h
  5K: 30 min
orden: 2
