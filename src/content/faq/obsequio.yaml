pregunta: ¿Recibiré obsequio de la prueba?
respuesta: |
  Sí, habrá obsequio de la prueba para los participantes: material de Otso.

  Las tallas solo se garantizarán a los inscritos antes del 31 de enero.
preguntaEu: Oparia jasoko dut probagatik?
respuestaEu: |
  Bai, parte-hartzaile guztiek probaren oparia jasoko dute: Otso materiala.

  Tailak urtarrilaren 31 baino lehen izena eman dutenei bermatuko zaizkie soilik.
